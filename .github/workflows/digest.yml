name: Digest

# 매일 21:00 KST: 일일 요약을 텔레그램으로 보낸다 (digest.py). 읽지 않아도 발행은 진행된다.
# 실행: Supabase pg_cron 이 매일 12:00 UTC(21:00 KST)에 workflow_dispatch 로 깨운다 (db/digest_cron.sql).
# GitHub 예약은 몇 시간씩 밀리고, 예비로 두면 요약이 두 번 가므로 두지 않는다.
# config.yaml 의 digest_time_kst 를 바꾸면 db/digest_cron.sql 의 cron 도 같이 바꾼다 (UTC).
# 수동 실행의 dry_run 은 보내지 않고 로그에만 출력한다.

on:
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      dry_run:
        description: '텔레그램으로 보내지 않고 로그에만 출력'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNT: ${{ matrix.account == 'openbrain' && '' || matrix.account }}
      SFX: ${{ matrix.account == 'openbrain' && '' || format('_{0}', matrix.account) }}
      AUTO_PUBLISH_DISABLED: ${{ vars[format('AUTO_PUBLISH_DISABLED{0}', matrix.account == 'openbrain' && '' || format('_{0}', matrix.account))] }}
      DRY_RUN: ${{ vars[format('DRY_RUN{0}', matrix.account == 'openbrain' && '' || format('_{0}', matrix.account))] == 'false' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', env.SFX)] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[format('SUPABASE_SERVICE_ROLE_KEY{0}', env.SFX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_TOKEN_ISSUED_AT: ${{ secrets[format('THREADS_TOKEN_ISSUED_AT{0}', env.SFX)] }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            python digest.py --dry-run
          else
            python digest.py
          fi
