name: Publish

# 예약 시각이 된 approved 글을 1개만 발행한다 (publisher.py).
# 주 실행: Supabase pg_cron 이 매시 12분·42분에 workflow_dispatch 로 깨운다 (db/publish_cron.sql).
# 아래 schedule 은 Supabase 가 멈췄을 때를 위한 예비(4시간마다). GitHub 예약 실행은 몇 시간씩 밀린다.
# 규칙 8 킬 스위치: 저장소 Variables 의 AUTO_PUBLISH_DISABLED=true 면 아무것도 하지 않는다.
# 규칙 9 DRY_RUN: 저장소 Variables 의 DRY_RUN 이 정확히 false 일 때만 실제 발행한다 (없으면 연습 모드).
#   수동 실행에서 dry_run 을 켜면 변수와 상관없이 연습 모드다.
#   실제 발행은 검수자 시험지 합격 기록(state/reviewer_exam.json)이 저장소에 있어야 한다.

on:
  schedule:
    - cron: '3 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 모드: API 를 부르지 않고 요청 내용만 로그'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish          # cancel_post.yml 과 같은 그룹: 동시에 돌지 않는다
  cancel-in-progress: false

jobs:
  publish:
    if: vars.AUTO_PUBLISH_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTO_PUBLISH_DISABLED: ${{ vars.AUTO_PUBLISH_DISABLED }}
      DRY_RUN: ${{ (vars.DRY_RUN == 'false' && inputs.dry_run != true) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish one due post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_ISSUED_AT: ${{ secrets.THREADS_TOKEN_ISSUED_AT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "DRY_RUN=${DRY_RUN}"
          python publisher.py
