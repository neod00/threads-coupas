name: Publish

# 예약 시각이 된 approved 글을 1개만 발행한다 (publisher.py).
# 주 실행: Supabase pg_cron 이 매시 12분·42분에 DB 를 보고, 할 일(예약 시각이 지난 글, 때가 된 링크 답글)이 있을 때만
#   workflow_dispatch 로 깨운다 (db/publish_cron.sql, accounts/<계정>/db/publish_cron.sql).
#   2026-10-27: 30분마다 무조건 깨우다 비공개 저장소의 Actions 무료 시간(월 2,000분)을 다 써서 이틀 멈췄다.
# 아래 schedule 은 Supabase 가 멈췄을 때를 위한 예비(4시간마다)이고, 답글 감시(자동 정지)도 이때 돈다. GitHub 예약 실행은 몇 시간씩 밀린다.
# 규칙 8 킬 스위치: 저장소 Variables 의 AUTO_PUBLISH_DISABLED=true 면 아무것도 하지 않는다.
# 규칙 9 DRY_RUN: 저장소 Variables 의 DRY_RUN 이 정확히 false 일 때만 실제 발행한다 (없으면 연습 모드).
#   수동 실행에서 dry_run 을 켜면 변수와 상관없이 연습 모드다.
#   실제 발행은 검수자 시험지 합격 기록(state/reviewer_exam.json)이 저장소에 있어야 한다.

on:
  schedule:
    - cron: '3 */4 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      dry_run:
        description: '연습 모드: API 를 부르지 않고 요청 내용만 로그'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.account || 'scheduled' }}   # cancel_post.yml 과 같은 그룹(계정별): 같은 계정끼리는 동시에 돌지 않는다
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNT: ${{ matrix.account != 'openbrain' && matrix.account || '' }}
      SFX: ${{ matrix.account != 'openbrain' && format('_{0}', matrix.account) || '' }}
      AUTO_PUBLISH_DISABLED: ${{ vars[format('AUTO_PUBLISH_DISABLED{0}', matrix.account != 'openbrain' && format('_{0}', matrix.account) || '')] }}
      DRY_RUN: ${{ (vars[format('DRY_RUN{0}', matrix.account != 'openbrain' && format('_{0}', matrix.account) || '')] == 'false' && inputs.dry_run != true) && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish one due post
        env:
          THREADS_USER_ID: ${{ secrets[format('THREADS_USER_ID{0}', env.SFX)] }}
          THREADS_ACCESS_TOKEN: ${{ secrets[format('THREADS_ACCESS_TOKEN{0}', env.SFX)] }}
          THREADS_TOKEN_ISSUED_AT: ${{ secrets[format('THREADS_TOKEN_ISSUED_AT{0}', env.SFX)] }}
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', env.SFX)] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[format('SUPABASE_SERVICE_ROLE_KEY{0}', env.SFX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "DRY_RUN=${DRY_RUN}"
          python publisher.py
