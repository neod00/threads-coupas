name: Generate

# 매일 20:00 KST: 다음 날 분량 생성 → 코드 가드 → AI 검수자 → 슬롯 배정 (pipeline.py).
# 주 실행: Supabase pg_cron 이 매일 11:00 UTC(20:00 KST)에 workflow_dispatch 로 깨운다 (db/generate_cron.sql).
# 아래 schedule 은 Supabase 가 멈췄을 때를 위한 예비다. GitHub 예약은 몇 시간씩 밀리므로 3시간 늦춰 둔다 (이미 채워진 슬롯은 건너뛴다).
# 킬 스위치(AUTO_PUBLISH_DISABLED=true)·자동 정지 상태면 생성하지 않는다.
# 수동 실행의 dry_run 은 생성·검증만 하고 DB 에 저장하지 않는다 (LLM 비용은 발생).

on:
  schedule:
    - cron: '0 14 * * *'     # 예비. 14:00 UTC = 23:00 KST
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      dry_run:
        description: '생성·검증만 하고 저장하지 않음 (LLM 비용 발생)'
        required: false
        type: boolean
        default: true
      variant:
        description: '링크 위치'
        required: false
        type: choice
        options: [link_in_body, link_in_reply]
        default: link_in_reply

permissions:
  contents: read

concurrency:
  group: generate-${{ github.event_name == 'workflow_dispatch' && inputs.account || 'scheduled' }}
  cancel-in-progress: false

jobs:
  generate:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40      # Gemini 분당 한도 대기·재시도를 감안
    env:
      ACCOUNT: ${{ matrix.account != 'openbrain' && matrix.account || '' }}
      SFX: ${{ matrix.account != 'openbrain' && format('_{0}', matrix.account) || '' }}
      AUTO_PUBLISH_DISABLED: ${{ vars[format('AUTO_PUBLISH_DISABLED{0}', matrix.account != 'openbrain' && format('_{0}', matrix.account) || '')] }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate tomorrow's posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', env.SFX)] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[format('SUPABASE_SERVICE_ROLE_KEY{0}', env.SFX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_VARIANT: ${{ inputs.variant || 'link_in_reply' }}
        run: |
          set -euo pipefail
          args=(generate --variant "${INPUT_VARIANT}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          echo "실행: python pipeline.py ${args[*]}"
          python pipeline.py "${args[@]}"
