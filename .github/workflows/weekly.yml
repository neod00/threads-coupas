name: Weekly

# 매주 일요일 21:00 KST: 주간 리포트 + AI 리뷰 "다음 주 바꿀 3가지" (weekly_report.py).
# 리포트는 텔레그램으로 보내고, 파일은 이 실행의 아티팩트(weekly-report)로 90일 보관한다.
# AI 리뷰 제안은 자동 적용하지 않는다. 수동 실행의 dry_run 은 텔레그램으로 보내지 않는다.

on:
  schedule:
    - cron: '0 12 * * 0'     # 일요일 12:00 UTC = 일요일 21:00 KST
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      dry_run:
        description: '텔레그램으로 보내지 않고 파일만 만듦'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  weekly:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT: ${{ matrix.account != 'openbrain' && matrix.account || '' }}
      SFX: ${{ matrix.account != 'openbrain' && format('_{0}', matrix.account) || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', env.SFX)] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[format('SUPABASE_SERVICE_ROLE_KEY{0}', env.SFX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            python weekly_report.py --dry-run
          else
            python weekly_report.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-report-${{ matrix.account }}
          path: reports/**/*.md
          if-no-files-found: ignore
          retention-days: 90
