name: Metrics

# 매일 09:00 KST: 발행 후 24시간·72시간이 지난 글의 스레드 인사이트를 저장한다 (metrics.py).
# Threads 는 읽기만 한다. 수동 실행의 dry_run 은 수집만 하고 저장하지 않는다.

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      dry_run:
        description: '수집만 하고 저장하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  metrics:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNT: ${{ matrix.account != 'openbrain' && matrix.account || '' }}
      SFX: ${{ matrix.account != 'openbrain' && format('_{0}', matrix.account) || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect insights
        env:
          THREADS_USER_ID: ${{ secrets[format('THREADS_USER_ID{0}', env.SFX)] }}
          THREADS_ACCESS_TOKEN: ${{ secrets[format('THREADS_ACCESS_TOKEN{0}', env.SFX)] }}
          THREADS_TOKEN_ISSUED_AT: ${{ secrets[format('THREADS_TOKEN_ISSUED_AT{0}', env.SFX)] }}
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', env.SFX)] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[format('SUPABASE_SERVICE_ROLE_KEY{0}', env.SFX)] }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            python metrics.py --dry-run
          else
            python metrics.py
          fi
