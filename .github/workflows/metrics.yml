name: Metrics

# 매일 09:00 KST: 발행 후 24시간·72시간이 지난 글의 스레드 인사이트를 저장한다 (metrics.py).
# Threads 는 읽기만 한다. 수동 실행의 dry_run 은 수집만 하고 저장하지 않는다.

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '수집만 하고 저장하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect insights
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_ISSUED_AT: ${{ secrets.THREADS_TOKEN_ISSUED_AT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            python metrics.py --dry-run
          else
            python metrics.py
          fi
