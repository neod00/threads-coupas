name: Capture

# 매주 월요일 06:00 KST: 내 앱 화면을 다시 찍어 바뀐 화면만 data/media/ 에 커밋한다 (capture.py, 규칙 2).
# 시연 영상은 파일이 없거나 그 앱 화면이 바뀌었을 때만 다시 만든다 (수동 실행의 clips 로 강제).
# allow_media 계정이 아니거나 apps.yaml 이 없는 계정은 아무것도 하지 않는다.
# 이 워크플로만 contents: write 다 — 캡처한 그림·영상을 커밋하려고. 비밀값은 쓰지 않는다.
# 수동 실행의 dry_run 은 찍기만 하고 커밋하지 않는다. 앱을 고친 뒤 바로 다시 찍으려면 수동 실행에 앱 id 를 넣는다.

on:
  schedule:
    - cron: '0 21 * * 0'     # 일 21:00 UTC = 월 06:00 KST
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      app:
        description: '앱 id (apps.yaml). 비우면 전부'
        required: false
        type: string
        default: ''
      clips:
        description: '시연 영상을 모두 다시 만듦'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '찍기만 하고 커밋하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  capture:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT: ${{ matrix.account != 'openbrain' && matrix.account || '' }}
      SFX: ${{ matrix.account != 'openbrain' && format('_{0}', matrix.account) || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      # 영상 변환(ffmpeg)·자막 한글 글꼴
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Capture app screens
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_CLIPS: ${{ inputs.clips }}
        run: |
          ARGS=()
          if [ -n "${INPUT_APP}" ]; then ARGS+=(--app "${INPUT_APP}"); fi
          if [ "${INPUT_CLIPS}" = "true" ]; then ARGS+=(--clips); fi
          python capture.py "${ARGS[@]}"
      - name: Commit changed screens and clips
        # 화면 하나가 실패해도 찍힌 화면은 커밋한다
        if: ${{ always() && inputs.dry_run != true }}
        env:
          MATRIX_ACCOUNT: ${{ matrix.account }}
        run: |
          if [ -n "${ACCOUNT}" ]; then DIR="accounts/${ACCOUNT}/data/media"; else DIR="data/media"; fi
          [ -d "${DIR}" ] || exit 0
          git add -A -- "${DIR}"
          if git diff --cached --quiet; then echo "바뀐 화면이 없습니다"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture app screens and clips (${MATRIX_ACCOUNT})"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
