name: Cancel post

# 예정 글(approved, 발행 전)을 cancelled 로 바꾼다. GitHub 모바일 앱의 Actions 탭에서도 실행할 수 있다.
# post_id 는 일일 요약에 표시된다.

on:
  workflow_dispatch:
    inputs:
      account:
        description: '계정 (openbrain 또는 accounts/ 아래 폴더 이름). 예약 실행은 저장소 변수 ACCOUNTS_JSON 의 계정 전체'
        required: false
        type: string
        default: openbrain
      post_id:
        description: '취소할 post_id (일일 요약에 표시된 값)'
        required: true
        type: string
      dry_run:
        description: '취소할 수 있는지만 확인하고 바꾸지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.account || 'scheduled' }}   # 같은 계정의 발행 작업과 동시에 돌지 않게 같은 그룹을 쓴다
  cancel-in-progress: false

jobs:
  cancel:
    strategy:
      fail-fast: false          # 한 계정이 실패해도 다른 계정은 계속 돈다
      matrix:
        account: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.account) || vars.ACCOUNTS_JSON || '["openbrain"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCOUNT: ${{ matrix.account != 'openbrain' && matrix.account || '' }}
      SFX: ${{ matrix.account != 'openbrain' && format('_{0}', matrix.account) || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Cancel
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL{0}', env.SFX)] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets[format('SUPABASE_SERVICE_ROLE_KEY{0}', env.SFX)] }}
          INPUT_POST_ID: ${{ inputs.post_id }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! [[ "${INPUT_POST_ID}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "post_id 형식 오류: UUID 가 필요합니다." >&2
            exit 1
          fi
          args=(cancel "${INPUT_POST_ID}")
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python actions.py "${args[@]}"
