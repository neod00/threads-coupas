# 홍보할 내 앱 목록 (openbrain 계정, 2026-10-30). capture.py 가 이 목록대로 내 앱 화면을 찍고 시연 영상을 만들어
# data/media/<앱 id>/ 에 저장한다 (목록은 media.json).
#
# 규칙 2 (남의 이미지·영상 금지): 캡처는 url 의 호스트(와 allowed_hosts)로만 이동한다. 다른 사이트로 넘어가면 그 화면은 실패.
# 예시 파일(upload)은 data/app_samples/<앱 id>/ 안의 파일만 쓴다. 진짜 개인정보가 든 파일은 넣지 않는다 (공개 저장소).
#
# 단계(steps), 위에서부터 차례로 실행:
#   goto: /경로               앱 주소 기준 경로로 이동
#   click: CSS 선택자          누르기
#   upload: {selector, file}  파일 입력에 예시 파일 넣기 (file 은 data/app_samples/<앱 id>/ 안 이름)
#   fill: {selector, text}    입력칸 채우기
#   type: 글자                키보드로 입력 (지금 초점 위치). 영상에서는 사람이 치는 속도로
#   press: 키                 키 누르기 (예: Enter, Control+A). 여러 번: {key: Backspace, times: 10}
#   wait: 밀리초              기다리기
#   wait_for: CSS 선택자       그 요소가 보일 때까지 기다리기
#   scroll_to: CSS 선택자      그 요소가 화면 위쪽에 오게 스크롤 (영상에서는 부드럽게)
# 영상(clips)의 steps 에서만:
#   zoom: {selector, scale}   그 요소 쪽으로 부드럽게 확대 (scale 1~3)
#   unzoom: true              확대를 풀고 원래 화면으로
#   caption: 문구             아래쪽 자막을 이 문구로 바꾼다 (장면 전환, 40자 이하)
#   title: {text, sub}        화면 전체를 덮는 큰 훅 문구 1.7초 (첫 단계면 영상 첫 프레임 = 미리보기 그림)
#   영상에서 click 은 누르는 곳에 동그란 표시가 퍼진 뒤 누르고, type 은 사람이 치는 속도로 입력한다.
#
# shots: 휴대폰 화면(390x844, 2배) 그대로 찍는다 (PNG 780x1688).
# clips: 시연 영상 (MP4 780x1688, 30fps, 소리 없음, 30초 이하).
#   setup 은 녹화 전 준비(영상에 안 나옴), steps 가 녹화되는 부분, caption 은 처음 자막(선택),
#   end 는 마지막 2.2초 끝 화면 {title, sub, cta(선택, 버튼 모양 문구), color}. 모든 문구는 금지어 검사를 거친다.

apps:
  - id: pdfmonster
    name: PdfMonster
    url: https://pdfmonster.xyz/
    # 글감 (app_posts.py, PLAN 1-2). 글의 사실·숫자는 여기 적힌 것만 쓴다. 사람이 확인하고 고친다.
    # updates 는 실제로 고친 것만 적는다 (devlog 글은 여기 적힌 것으로만 만든다. 비어 있으면 devlog 를 쓰지 않는다)
    info:
      one_liner: 브라우저에서 PDF 글자를 그 자리에서 바로 고치는 무료 편집기
      audience: 계약서·서류 PDF 를 가끔 고쳐야 하는 직장인과 학생
      problem: PDF 글자 하나 고치려고 프로그램을 설치하거나, 개인정보가 든 서류를 처음 보는 사이트에 올려야 하는 것
      how: PDF 처리 엔진이 내 브라우저 안에서 돌아가서, 파일이 서버로 올라가지 않는다
      facts:
        - 무료
        - 회원가입 없음
        - 설치 없음
        - 파일이 서버로 올라가지 않고 내 브라우저 안에서만 처리된다
        - PC·Mac·모바일 브라우저에서 쓸 수 있다
        - 최대 60MB PDF 까지 열 수 있다
        - 한글·HWP 에서 바꾼 PDF 도 원래 글꼴과 간격에 맞춰 고쳐진다
      limits:
        - 혼자 만들고 있어서 아직 거친 부분이 있다
      # 만든 사람이 직접 들려준 진짜 이야기 (2026-10-30). 다른 회사·제품 이름은 넣지 않는다 (검수 R10)
      stories:
        - 회사에서 PDF 문서를 고쳐야 했는데, 많이 쓰는 PDF 편집 프로그램은 유료였다
        - PDF 편집 사이트를 여러 개 써 봤는데, 몇 번 쓰면 유료로 바뀌거나 처음부터 유료인 곳이 많아서 그냥 직접 만들었다
        - 유료 PDF 편집 프로그램에서 쓰던 기능들을 하나씩 가져와 넣었고, 앞으로도 계속 업데이트할 생각이다
      link: https://pdfmonster.xyz/
      launch_media: [edit-text-demo, edit-text, search]
      features:
        - id: edit-text
          name: 글자 수정
          desc: PDF 글줄을 눌러 그 자리에서 글자를 고친다. 한글·HWP 변환 PDF 도 원래 글꼴과 간격에 맞춰진다
          media: edit-text
          clip: edit-text-demo
        - id: redact
          name: 개인정보 찾아 가리기
          desc: 전화번호·주민등록번호·이메일·카드번호·계좌번호 형태를 자동으로 찾아 한꺼번에 가린다. 가린 글자는 저장할 때 PDF 에서 실제로 지워진다
          media: search
          clip: edit-text-demo
        - id: sign
          name: 서명 넣기
          desc: 손으로 그리거나 이름을 입력해 서명을 만들고 PDF 에 넣는다. 서명은 내 브라우저에만 저장된다
        - id: merge-split
          name: 합치기·나누기
          desc: 여러 PDF 를 하나로 합치거나, 필요한 쪽만 뽑거나 여러 파일로 나눈다
        - id: compress
          name: 용량 줄이기
          desc: PDF 안의 이미지를 다시 압축해 파일 용량을 줄인다
        - id: annotate
          name: 텍스트·도형·형광펜
          desc: PDF 위에 글상자, 사각형·화살표 같은 도형, 펜과 형광펜으로 표시한다
        - id: stamp
          name: 워터마크·쪽 번호
          desc: 대외비·사본 같은 워터마크와 쪽 번호를 넣는다
      updates: []
      questions:
        - PDF 고칠 때 제일 귀찮은 게 뭐예요
        - PDF 고칠 일 생기면 보통 어떻게 하세요
        - 서류 PDF 를 온라인 사이트에 올리는 게 찜찜한 적 있어요
        - 계약서 PDF 에서 제일 자주 고치는 부분은 어디예요
        - PDF 편집기에 이런 기능 하나 더 있으면 좋겠다 싶은 것
        - 휴대폰으로 PDF 고쳐 본 적 있어요
    shots:
      - id: home
        feature: 첫 화면 — 파일이 서버로 올라가지 않는 무료 PDF 편집기
        steps:
          - goto: /
          - wait: 1500
      - id: editor
        feature: PDF를 연 편집 화면 — 글자 수정·도형·서명·가림 도구
        steps:
          - goto: /
          - upload: {selector: "#fileInput", file: contract-sample.pdf}
          - wait_for: '[aria-label^="줄 수정"]'
          - wait: 1500
      - id: edit-text
        feature: 글자 수정 — PDF 글자를 그 자리에서 고치기
        steps:
          - goto: /
          - upload: {selector: "#fileInput", file: contract-sample.pdf}
          - wait_for: '[aria-label="줄 수정: 계약 금액: 1,000,000원"]'
          - click: '[aria-label="줄 수정: 계약 금액: 1,000,000원"]'
          - wait: 800
          - press: End
          - press: {key: Backspace, times: 10}
          - type: "2,500,000원"
          - wait: 1000
      - id: search
        feature: 찾기 — 글자 찾기와 개인정보 자동 찾아 가리기
        steps:
          - goto: /
          - upload: {selector: "#fileInput", file: contract-sample.pdf}
          - wait_for: '[aria-label^="줄 수정"]'
          - click: "#btnSearch"
          - wait: 1200
    clips:
      - id: edit-text-demo
        feature: 글자 수정·개인정보 가림 시연 — 계약서 금액을 고치고 이름을 찾아 가리는 장면
        end: {title: PdfMonster, sub: 무료 · 가입 없음 · 파일 업로드 없음, cta: 링크는 댓글에 있어요}
        setup:
          - goto: /
          - upload: {selector: "#fileInput", file: contract-sample.pdf}
          - wait_for: '[aria-label="줄 수정: 계약 금액: 1,000,000원"]'
          - wait: 500
        steps:
          # 장면 1: 훅 (첫 프레임 = 미리보기 그림)
          - title: {text: "PDF 글자 하나 고치려고\n프로그램 까셨어요?", sub: 브라우저에서 바로 돼요}
          # 장면 2: 글자 수정
          - caption: 고칠 줄을 누르고
          - zoom: {selector: '[aria-label="줄 수정: 계약 금액: 1,000,000원"]', scale: 1.9}
          - wait: 900
          - click: '[aria-label="줄 수정: 계약 금액: 1,000,000원"]'
          - wait: 300
          - caption: 그 자리에서 바로 고쳐요
          - press: End
          - press: {key: Backspace, times: 10}
          - type: "2,500,000원"
          - wait: 600
          - press: Enter
          - wait: 300
          # 장면 3: 개인정보 찾아 가리기
          - unzoom: true
          - caption: 이름·전화번호도 찾아서 가려요
          - wait: 700
          - click: "#btnSearch"
          - wait: 400
          - click: "#searchInput"
          - type: 홍길동
          - click: "#searchRun"
          - wait: 700
          - click: "#searchRedactAll"
          - wait: 500
          - click: "#searchClose"
          - wait: 300
          - zoom: {selector: '[aria-label="줄 수정: 계약서"]', scale: 2.2}
          - caption: 파일은 내 브라우저 밖으로 안 나가요
          - wait: 1600

  - id: lawauction
    name: 로옥션
    url: https://www.courtauction.site/
    # www 없는 주소로 넘어가므로 함께 허용한다 (2026-11-14 확인)
    allowed_hosts: [courtauction.site]
    # 글감 (2026-11-14 사이트 첫 화면·소개 페이지에서 옮겨 적음). 사람이 확인하고 고친다.
    # 투자 권유처럼 보이지 않게: 싸게 산다·돈 된다는 말은 쓰지 않는다. "최저가"는 금지어라 "최저입찰가"로 적는다 (규칙 7)
    info:
      one_liner: 법원마다 따로 올라오는 파산·회생 자산매각 공고를 한곳에 모아 회차별 최저입찰가까지 정리하는 사이트
      audience: 법원 파산·회생 자산매각(공매) 공고를 찾아보는 사람
      problem: 파산·회생 자산매각 공고는 법원마다 게시판에 따로 올라오고, 회차마다 최저입찰가가 얼마인지는 첨부 공고문을 하나씩 열어 봐야 안다
      how: 전국 17개 법원 게시판을 하루 3번 확인해 공고를 모으고, 첨부 공고문을 읽어 회차별 최저입찰가를 표로 옮긴다
      facts:
        - 무료
        - 회원가입 없음
        - 전국 17개 법원의 파산·회생 자산매각 공고를 모은다
        - 법원 게시판을 하루 3번 확인해 새 공고를 모은다
        - 첨부 공고문을 읽어 회차마다 최저입찰가가 얼마까지 내려가는지 표로 정리한다
        - 부동산·기계설비·채권·차량·특허 같은 자산 유형과 법원별로 공고를 나눠 본다
        - 취득세·회차별 총비용·입찰보증금 같은 계산기 10종이 있다
      limits:
        - 혼자 만들고 운영하는 민간 서비스라 법원과 제휴하지 않았고, 공고의 효력과 조건은 법원 원문이 기준이다
        - 낙찰 여부와 낙찰 금액은 법원이 공개하지 않아 보여 주지 않는다
        - 회차표는 첨부 공고문에서 읽은 참고 정보이고, 2회차 이후는 앞 회차가 유찰돼야 열린다
        - 첨부 공고문을 읽지 못한 공고는 회차표 없이 원문 링크만 보여 준다
        - 법률·세무 판단을 대신하지 않는다
      # 만든 사람이 직접 들려준 진짜 이야기를 여기에 적는다 (만든 계기 등). 비어 있으면 소개 글에 1인칭 경험을 쓰지 않는다
      stories: []
      link: https://www.courtauction.site/
      launch_media: [rounds-demo, rounds, home]
      features:
        - id: rounds
          name: 회차별 최저입찰가 표
          desc: 첨부 공고문을 읽어 회차마다 최저입찰가가 1회차의 몇 퍼센트까지 내려가는지 표로 보여 준다. 2회차 이후는 앞 회차가 유찰돼야 열린다
          media: rounds
          clip: rounds-demo
        - id: collect
          name: 법원 공고 모아 보기
          desc: 전국 17개 법원 게시판의 파산·회생 자산매각 공고를 하루 3번 모아, 법원·자산 유형·검색어로 찾는다
          media: home
          clip: rounds-demo
        - id: new-notices
          name: 새로 올라온 공고
          desc: 최근 7일 안에 법원 게시판에 올라온 공고만 모아 보고, 최신순·만료 임박순·최저입찰가 낮은순으로 정렬한다
          media: new-notices
        - id: asset-types
          name: 자산 유형별 공고
          desc: 부동산·기계설비·채권·차량·특허 같은 자산 유형마다 지금 게시 중인 공고 수와 이번 주 새 공고 수를 보여 준다
          media: asset-types
        - id: round-cost
          name: 회차별 총비용 계산기
          desc: 1회차 최저입찰가와 회차당 인하율을 넣으면 회차마다 최저입찰가에 취득세와 기타 비용을 더한 총비용을 나란히 보여 준다
          media: round-cost
        - id: acquisition-tax
          name: 취득세 계산기
          desc: 취득가액을 넣으면 주택 수·조정대상지역·면적에 따라 취득세를 계산한다
          media: acquisition-tax
      updates: []
    shots:
      - id: home
        feature: 첫 화면 — 전국 법원 파산·회생 자산매각 공고 검색
        steps:
          - goto: /
          - wait: 1500
      - id: rounds
        feature: 회차표 — 회차마다 최저입찰가가 내려가는 폭
        steps:
          - goto: /
          - scroll_to: "#feat-title"
          - wait: 800
      - id: new-notices
        feature: 새로 올라온 공고 목록
        steps:
          - goto: /
          - scroll_to: "#upcoming-title"
          - wait: 800
      - id: asset-types
        feature: 자산 유형별 게시 중 공고 수
        steps:
          - goto: /
          - scroll_to: "#types-title"
          - wait: 800
      - id: round-cost
        feature: 회차별 총비용 계산기 — 최저입찰가 + 취득세 + 기타 비용
        steps:
          - goto: /tools/round-cost
          - click: "#rc-first"
          - type: "100000000"
          - wait: 600
          - scroll_to: "table"
      - id: acquisition-tax
        feature: 취득세 계산기
        steps:
          - goto: /tools/acquisition-tax
          - click: '[aria-label="취득가액"]'
          - type: "300000000"
          - wait: 800
    clips:
      - id: rounds-demo
        feature: 공고 모아 보기·회차표·총비용 계산 시연 — 전국 법원 공고를 모은 첫 화면에서 회차표와 계산기까지
        end: {title: 로옥션, sub: 무료 · 가입 없음 · 전국 17개 법원, cta: 링크는 댓글에 있어, color: "#1f3d7a"}
        setup:
          - goto: /
          - wait: 800
        steps:
          # 장면 1: 훅 (첫 프레임 = 미리보기 그림)
          - title: {text: "법원 17곳 매각 공고\n한곳에 모았어", sub: 회차별 최저입찰가까지}
          - caption: 법원마다 따로 올라오는 공고를 한곳에
          - wait: 1400
          # 장면 2: 회차표
          - caption: 회차마다 최저입찰가가 얼마까지 내려가는지
