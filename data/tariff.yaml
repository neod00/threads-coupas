# 주택용 저압 전기요금표 — 한전 사이버지점에서 직접 확인한 값을 입력한다.
# 코드에는 요금 숫자를 하드코딩하지 않는다. 값이 비어 있으면 계산기가 실행을 거부한다.
# 입력 후 점검: python calculator.py --power 2000 --hours 4

effective_date: null          # 확인한 요금표 기준일, 예: "2026-10-01"
season: winter                # 누진 구간이 계절별로 다를 수 있음
tiers:                        # 주택용 저압 누진 구간 (전력량요금, 원/kWh)
  - {upto_kwh: null, rate_per_kwh: null}
  - {upto_kwh: null, rate_per_kwh: null}
  - {upto_kwh: null, rate_per_kwh: null}    # 마지막 구간의 upto_kwh 는 null 로 둔다
surcharge_multiplier: null    # 부가세·전력기금 등 반영 배수, 예: 1.137
assumed_tier_for_posts: 2     # 게시물에서 가정할 누진 구간
