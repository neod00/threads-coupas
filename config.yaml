# openbrain7777 설정 — 2026-10-30 부터 내가 만든 앱을 홍보하는 1인 개발자 계정 (PLAN 1-2)
# 값을 바꾼 뒤 `python settings.py` 로 점검한다.
# 코드(settings.py)가 PLAN 1장 규칙보다 느슨한 값은 거부한다.
# (쿠팡 계정 시절 설정은 tests/fixtures/coupang_config.yaml 에 그대로 남아 있다)

# 계정이 다루는 것: app = 내가 만든 앱 (글감은 data/apps.yaml 의 info, app_posts.py)
content: app

# ── 발행 규칙 (규칙 5, Step 5) ─────────────────────────────
# 2026-10-30: 하루 3개 = 링크 글 1개(앱 소개·기능) + 링크 없는 글 2개(개발 일지·질문)
# 2026-10-31: 질문 글(ask)을 뺐다. 링크 글 1개 + 개발 일지(info.updates 에 적은 것이 있을 때만). 대개 하루 1개다.
max_posts_per_day: 3
min_gap_hours: 2              # 코드 최소값 2보다 작으면 로드 실패
# 반드시 따옴표로 감싼다 (따옴표가 없으면 YAML이 12:30을 숫자 750으로 읽는다).
# 자정을 넘는 간격까지 포함해 슬롯 사이도 min_gap_hours 이상이어야 한다.
slots_kst: ["08:10", "12:30", "20:30"]
max_link_post_ratio: 0.34     # 하루 3개 중 링크 글 1개

# ── 모델 (Step 1) ────────────────────────────────────────
# 생성 모델(대체 모델 포함)과 검수 모델의 제공사가 같으면 실행을 거부한다.
generator_model: gemini-3.8-flash          # 2.5-flash 는 새 계정에 404 (2026-09-28)
generator_fallback_model: null           # 검수가 OpenAI 인 동안은 같은 회사라 끔 (2026-10-02). Claude 검수로 돌아가면 gpt-4.1-mini
reviewer_model: gpt-5.4-mini             # 임시 (2026-10-02): Anthropic 크레딧 API 미반영. 해결되면 claude-sonnet-5 로 되돌리고 재시험

# ── 글 제한 (Step 3, 4) ───────────────────────────────────
limits:
  max_chars: 500              # 스레드 API 한도. 500을 넘길 수 없다
  max_body_chars: 350         # 훅을 뺀 본문
  max_urls: 1                 # 본문 URL + 링크 첨부 합계

# ── 링크 답글 첫 줄 (규칙 3) ──────────────────────────────
# 앱 링크가 있는 답글의 첫 줄은 이 문장과 정확히 같아야 한다. 내가 만든 앱이라는 사실을 밝힌다 ("만든 앱" 필수).
# 2026-10-30 사용자 결정: 스레드 성격에 맞게 반말
disclosure_text: "내가 만든 앱이야."

# ── 금지어 (규칙 7, Step 4) ───────────────────────────────
# settings.REQUIRED_BANNED_WORDS 에 있는 필수 금지어는 여기서 빼도 항상 적용된다.
banned_words:
  - 판매가
  - 최저가
  - 가격
  - 할인
  - 특가
  - 세일
  - 쿠폰
  - 가성비
  - 역대
  - 무조건
  - "100%"
  - 보장
  - 최고
  - 1위
  - 품절 임박
  # 사용 경험 표현
  - 써봤
  - 사용해보니
  - 써보니
  - 우리 집
  # 안전·보안 장담 (앱 글, 2026-10-30)
  - 안전
  - 완벽
  - 해킹
  - 유출 걱정
  - 평생
  - 인생 앱

# ── 금지 훅 문구 (Step 3) ──────────────────────────────────
# settings.REQUIRED_BANNED_HOOK_PHRASES 는 여기서 빼도 항상 적용된다.
banned_hook_phrases:
  - 나만 알고
  - 100명 중
  - 저장 안 하면
  - 절대 안 함
  - 이거 모르면 손해
  - 충격
  - 실화
  - 역대급

# ── 판정 기준 (PLAN 0장) ──────────────────────────────────
# 쿠팡 시절 항목이 그대로 남아 있다 (앱 계정의 주간 리포트는 조회수만 본다)
criteria:
  week2_min_median_views: 300     # 2주차 끝: 게시물 조회수 중앙값
  week2_min_coupang_clicks: 30
  week4_min_commission_won: 30000
  week4_min_orders: 5

digest_time_kst: "21:00"          # 일일 요약 발송 시각 (Step 5)

# 첫 실제 발행일 (YYYY-MM-DD). 주차 계산 기준. 앱 홍보 글이 처음 나가는 날로 사람이 정한다.
test_start_date: null

# 말투: 반말 (2026-10-30 사용자 결정. 인기 1인 개발 글 분석: 반말·짧은 줄·첫 줄 고백/질문, prompts/app_base.md)
tone: casual

# 만들 글 유형 (launch, feature, devlog, ask). 앱마다 소개(launch)는 한 번, 그 뒤로 기능(feature)이 링크 자리를 채운다.
# ask 는 2026-10-31 뺐다: 팔로워 없는 계정이 질문으로 빌드업하면 의도적으로 보인다 (사람 판단). 앱을 바로 소개한다.
post_types: [launch, feature, devlog]

# 게시물 이미지·영상 (규칙 2 예외, PLAN 1-1). data/media/ 의 내 앱 캡처·시연 영상만 붙인다 (media.py, 가드 G9).
allow_media: true
