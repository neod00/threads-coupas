# 스레드 × 쿠팡파트너스 4주 테스트 설정
# 값을 바꾼 뒤 `python settings.py` 로 점검한다.
# 코드(settings.py)가 PLAN 1장 규칙보다 느슨한 값은 거부한다.

# ── 발행 규칙 (규칙 5, Step 5) ─────────────────────────────
max_posts_per_day: 6          # 코드 상한 6을 넘으면 로드 실패 (2026-10-17: 4 → 6)
min_gap_hours: 2              # 코드 최소값 2보다 작으면 로드 실패
# 반드시 따옴표로 감싼다 (따옴표가 없으면 YAML이 12:30을 숫자 750으로 읽는다).
# 자정을 넘는 간격까지 포함해 슬롯 사이도 min_gap_hours 이상이어야 한다.
slots_kst: ["08:10", "10:30", "13:00", "16:00", "19:00", "21:30"]
max_link_post_ratio: 0.6      # 링크 없는 글을 최소 40% 유지 (하루 6개면 링크 글 3개, 링크 없는 글 3개)

# ── 모델 (Step 1) ────────────────────────────────────────
# 생성 모델(대체 모델 포함)과 검수 모델의 제공사가 같으면 실행을 거부한다.
generator_model: gemini-3.8-flash          # 2.5-flash 는 새 계정에 404 (2026-09-28)
generator_fallback_model: null           # 검수가 OpenAI 인 동안은 같은 회사라 끔 (2026-10-02). Claude 검수로 돌아가면 gpt-4.1-mini
reviewer_model: gpt-5.4-mini             # 임시 (2026-10-02): Anthropic 크레딧 API 미반영. 해결되면 claude-sonnet-5 로 되돌리고 재시험

# ── 글 제한 (Step 3, 4) ───────────────────────────────────
limits:
  max_chars: 500              # 스레드 API 한도. 500을 넘길 수 없다
  max_body_chars: 350         # 대가성 문구를 뺀 본문
  max_urls: 1                 # 본문 URL + 링크 첨부 합계

# ── 대가성 문구 (규칙 3) ──────────────────────────────────
# 링크가 있는 글은 본문 첫 줄이 이 문장과 정확히 같아야 한다.
disclosure_text: "[광고] 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."

# ── 금지어 (규칙 7, Step 4) ───────────────────────────────
# settings.REQUIRED_BANNED_WORDS 에 있는 필수 금지어는 여기서 빼도 항상 적용된다.
banned_words:
  - 판매가
  - 최저가
  - 가격
  - 할인
  - 특가
  - 세일
  - 쿠폰
  - 가성비
  - 역대
  - 무조건
  - "100%"
  - 보장
  - 최고
  - 1위
  - 품절 임박
  # 사용 경험 표현
  - 써봤
  - 사용해보니
  - 써보니
  - 우리 집
  # 안전·건강 표현
  - 안전
  - 화재
  - 무해
  - 전자파
  - 숙면
  - 건강에

# ── 금지 훅 문구 (Step 3) ──────────────────────────────────
# settings.REQUIRED_BANNED_HOOK_PHRASES 는 여기서 빼도 항상 적용된다.
banned_hook_phrases:
  - 나만 알고
  - 100명 중
  - 저장 안 하면
  - 절대 안 함
  - 이거 모르면 손해
  - 충격
  - 실화
  - 역대급

# ── 판정 기준 (PLAN 0장, 시작 전에 확정) ────────────────────
criteria:
  week2_min_median_views: 300     # 2주차 끝: 게시물 조회수 중앙값
  week2_min_coupang_clicks: 30    # 2주차 끝: 쿠팡 클릭 누적
  week4_min_commission_won: 30000 # 4주차 끝: 누적 수수료 (또는)
  week4_min_orders: 5             # 4주차 끝: 구매 건수

digest_time_kst: "21:00"          # 일일 요약 발송 시각 (Step 5)

# 첫 실제 발행일 (YYYY-MM-DD). 주차 계산 기준. 실제 발행 전에는 비워 둔다.
test_start_date: 2026-10-18   # 2026-10-16 PLAN v4(참여형·시즌 모음·진짜 후기)가 처음 나가는 날로 다시 잡음

# 만들 글 유형 (calc, compare, pick, bundle, talk, tip 중에서). 2026-10-16 사용자 결정: 팁·계산·비교 글은 재미없어서 중단.
# 링크 글 2자리 = 소개(pick)·시즌 모음(bundle, 이틀에 한 번), 링크 없는 2자리 = 참여형(talk).
post_types: [pick, bundle, talk]
