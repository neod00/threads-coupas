  - 무선 가습기, 사라 vs 마라
  - 커피머신, 사라 vs 마라
  - 전동 칫솔, 사라 vs 마라
  - 안마기, 사라 vs 마라
  - 주방 저울, 사라 vs 마라
  - 실리콘 뚜껑, 사라 vs 마라
  - 진공 밀폐 용기, 사라 vs 마라
  - 자동 급수기, 사라 vs 마라
  - 욕실 선반, 사라 vs 마라
  - 틈새 청소 도구, 사라 vs 마라
  - 접이식 건조대, 사라 vs 마라
