# 스레드 × 쿠팡파트너스 4주 테스트 설정
# 값을 바꾼 뒤 `python settings.py` 로 점검한다.
# 코드(settings.py)가 PLAN 1장 규칙보다 느슨한 값은 거부한다.

# ── 발행 규칙 (규칙 5, Step 5) ─────────────────────────────
max_posts_per_day: 6          # 2026-11-14 사용자 결정: 4 → 6 (첫 발행 뒤 25일, 보류 낮음, 상품 30개). 코드 상한 6
                              # 2026-10-30 사용자 결정: 3 → 4 (첫 발행 10/19 뒤 7일 지남, 상품 25개)
min_gap_hours: 2              # 코드 최소값 2보다 작으면 로드 실패
# 반드시 따옴표로 감싼다 (따옴표가 없으면 YAML이 12:30을 숫자 750으로 읽는다).
# 자정을 넘는 간격까지 포함해 슬롯 사이도 min_gap_hours 이상이어야 한다.
slots_kst: ["13:00", "15:00", "17:00", "19:00", "21:00", "23:00"]   # 11-20 사용자 결정: 오전 자리를 뺐다
                              # 링크 글이 앞 슬롯(13:00·15:00·17:00), 참여형이 저녁 슬롯(19:00·21:00·23:00)을 쓴다
                              # 11-06~11-20 오전(10:30·12:30) 링크 글 14개 조회 중앙 28, 오후(13~17시) 11개 중앙 122
                              # 이전: 11-14 ["10:30", "12:30", "15:00", "18:00", "20:30", "22:30"]
# 길이 실험 (2026-11-22 사용자 결정): 하루 대화(talk) 글 3개 중 1개만 120자 이하로 만든다. 자리는 날마다 돈다.
# 11월 글 76개에서 짧은 글이 조회가 높았고(121~160자 중앙 94, 161~200자 41), 120자 이하는 써 본 적이 없다.
# 2주(11-24 ~ 12-07 글) 뒤 calc_payload.experiment = "short" 글과 나머지 대화 글을 비교하고 이 두 줄을 지운다.
short_talk_max_chars: 120
short_talk_until: "2026-12-07"
# 댓글 실험 (2026-11-22 사용자 결정): 남은 대화 글 2개 중 1개도 120자 이하로 쓰되, 본문에서 뺀 걸리는 점을
# 본문 직후 내 첫 답글(링크 없음)로 단다. 하루 대화 글 = 보통 1 + 길이 실험 1 + 댓글 실험 1, 자리는 날마다 돈다.
# 같은 기간(short_talk_until)에 끝난다. 표시는 calc_payload.experiment = "short_reply"
short_talk_reply: true
max_link_post_ratio: 0.6      # 하루 6개면 링크 글(살까 말까 + 3시간 뒤 링크 답글) 3개, 링크 없는 참여형 3개
                              # 4개로 하면 상품 10일분이 40개 필요해 30개로는 모자란다 (11-14)

# ── 모델 (Step 1) ────────────────────────────────────────
# 생성 모델(대체 모델 포함)과 검수 모델의 제공사가 같으면 실행을 거부한다.
generator_model: gemini-3.8-flash          # 2.5-flash 는 새 계정에 404 (2026-09-28)
generator_fallback_model: null           # 검수가 OpenAI 인 동안은 같은 회사라 끔 (2026-10-02). Claude 검수로 돌아가면 gpt-4.1-mini
reviewer_model: gpt-5.4-mini             # 임시 (2026-10-02): Anthropic 크레딧 API 미반영. 해결되면 claude-sonnet-5 로 되돌리고 재시험

# ── 글 제한 (Step 3, 4) ───────────────────────────────────
limits:
  max_chars: 500              # 스레드 API 한도. 500을 넘길 수 없다
  max_body_chars: 350         # 대가성 문구를 뺀 본문
  max_urls: 1                 # 본문 URL + 링크 첨부 합계

# ── 대가성 문구 (규칙 3) ──────────────────────────────────
# 링크가 있는 글은 본문 첫 줄이 이 문장과 정확히 같아야 한다.
disclosure_text: "[광고] 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."

# ── 금지어 (규칙 7, Step 4) ───────────────────────────────
# settings.REQUIRED_BANNED_WORDS 에 있는 필수 금지어는 여기서 빼도 항상 적용된다.
banned_words:
  - 판매가
  - 최저가
  - 가격
  - 할인
  - 특가
  - 세일
  - 쿠폰
  - 가성비
  - 역대
  - 무조건
  - "100%"
  - 보장
  - 최고
  - 1위
  - 품절 임박
  # 사용 경험 표현
  - 써봤
  - 사용해보니
  - 써보니
  - 우리 집
  # 안전·건강 표현
  - 안전
  - 화재
  - 무해
  - 전자파
  - 숙면
  - 건강에

# ── 금지 훅 문구 (Step 3) ──────────────────────────────────
# settings.REQUIRED_BANNED_HOOK_PHRASES 는 여기서 빼도 항상 적용된다.
banned_hook_phrases:
  - 나만 알고
  - 100명 중
  - 저장 안 하면
  - 절대 안 함
  - 이거 모르면 손해
  - 충격
  - 실화
  - 역대급

# ── 판정 기준 (PLAN 0장, 시작 전에 확정) ────────────────────
criteria:
  week2_min_median_views: 300     # 2주차 끝: 게시물 조회수 중앙값
  week2_min_coupang_clicks: 30    # 2주차 끝: 쿠팡 클릭 누적
  week4_min_commission_won: 30000 # 4주차 끝: 누적 수수료 (또는)
  week4_min_orders: 5             # 4주차 끝: 구매 건수

digest_time_kst: "21:00"          # 일일 요약 발송 시각 (Step 5)

# 첫 실제 발행일 (YYYY-MM-DD). 주차 계산 기준. 실제 발행 전에는 비워 둔다.
test_start_date: 2026-10-19   # sabol.kka 첫 실제 발행일

# 만들 글 유형 (calc, compare, pick, bundle, talk, tip 중에서). 2026-10-16 사용자 결정: 팁·계산·비교 글은 재미없어서 중단.
# 링크 글 2자리 = 소개(pick)·시즌 모음(bundle, 시즌 중 이틀에 한 번 첫 자리), 링크 없는 1자리 = 참여형(talk). 2026-10-24 sabolkka bundle 다시 켬.
# 2026-11-14 사용자 결정: bundle 끔. 10개 조회수 중앙값 24·좋아요 1 (pick 47, talk 73). 링크 글 3자리 모두 pick.
#   pick 이 하루 3개라 상품 30개면 10일에 한 바퀴 (ops_advice 보충 알림 기준 10일과 같음)
# 2026-11-14 사용자 결정: 선물지니(내가 만든 선물 추천 앱) 글 gift 추가. 수·토요일에 링크 글 한 자리 (data/gift_app.yaml, PLAN 1-4)
post_types: [pick, talk, gift]

# ── 계정 전용 설정 (2026-10-18) ──────────────────────────────
tone: casual                  # 친근한 반말. 생성 프롬프트는 accounts/sabolkka/prompts/, 검수 R11 은 이 값을 따른다
reply_drafts: true            # 2026-11-14 사용자 결정: 일일 요약에 답글 초안 (하루 최대 6개) (reply_drafts.py)
reply_auto: true              # 2026-11-15 사용자 결정: 그 초안을 내 글 답글에 자동으로 단다 (auto_reply.py, sabol.kka 만)
                              # 실제로 다는 스위치는 저장소 Variables REPLY_AUTO_SABOLKKA=true (사람만 켠다). 없으면 연습 기록만
ops_advice: true            # 일일 요약에 "상품 링크 보충 필요"·"발행 수 늘려도 돼요" 알림 (ops_advice.py)
reply_delay_hours: 1          # 링크 답글(광고 문구 + 링크)을 본문 발행 1시간 뒤에 단다
                              # 2026-11-14 사용자 결정: 3 → 1. 링크 글 조회 주 1,000~1,500회에 클릭 2~8회라, 초반 독자가
                              # 링크를 못 보는지 확인한다. 11-15 ~ 11-28 2주 클릭을 그 전 2주(3시간)와 비교 (기본값 채널 합계)
                              # 바꾸면 accounts/sabolkka/db/publish_cron.sql 을 Supabase 에서 다시 실행해야 깨우기 시각도 맞는다
# 참여형(talk) 글 주제: "살까 말까" 질문 (2026-10-25: "사라 vs 마라"는 명령형이라 어색해서 바꿈). 가전·주방·꿀템·신기한 물건. 상품명·브랜드 없이 물건의 종류만 쓴다
