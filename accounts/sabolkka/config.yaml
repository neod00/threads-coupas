  - 식기세척기, 살까 말까
  - 건조기, 살까 말까
  - 로봇청소기, 살까 말까
  - 에어프라이어, 살까 말까
  - 음식물처리기, 살까 말까
  - 전기포트, 살까 말까
  - 핸디 청소기, 살까 말까
  - 제습기, 살까 말까
  - 공기청정기, 살까 말까
  - 빔프로젝터, 살까 말까
  - 전기 그릴, 살까 말까
  - 정수기, 살까 말까
  - 식탁 위 미니 냉장고, 살까 말까
  - 스팀 청소기, 살까 말까
  - 무선 가습기, 살까 말까
  - 커피머신, 살까 말까
  - 전동 칫솔, 살까 말까
  - 안마기, 살까 말까
  - 주방 저울, 살까 말까
  - 실리콘 뚜껑, 살까 말까
  - 진공 밀폐 용기, 살까 말까
  - 자동 급수기, 살까 말까
  - 욕실 선반, 살까 말까
  - 틈새 청소 도구, 살까 말까
  - 접이식 건조대, 살까 말까
  - 자동 비누 디스펜서, 살까 말까
