# sabol.kka 의 선물지니 글(gift) 글감 (2026-11-14 사용자 결정, PLAN 1-4).
# 사용자가 직접 만든 선물 추천 웹앱. 앱 안의 상품 링크가 사용자의 쿠팡 파트너스로 연결된다.
# 글의 사실은 facts 에 적힌 것만 쓴다 (생성기·검수 R7). 앱이 바뀌면 사람이 확인하고 고친다.
# 2026-11-14 couplegift.netlify.app 첫 화면에서 확인한 내용이다. 추천 결과 화면은 확인하지 않았다.

app:
  name: 선물지니
  url: https://couplegift.netlify.app/
  one_liner: 받는 사람 정보를 넣으면 AI 가 선물 아이디어를 골라 주는 웹앱
  facts:
    - 받는 사람의 성별, 나이, 성격 특성이나 MBTI, 기념일 종류, 예산 범위를 고르면 AI 가 선물 아이디어를 추천해 준다
    - 선호 카테고리(향수, 생활가전, 꽃, 체험 클래스 등)와 추가 정보를 더 적을 수 있다
    - 기념일은 생일, 사귄 지 100일, 결혼기념일, 크리스마스, 어버이날, 스승의날, 졸업, 취업 축하 등에서 고른다
    - 추천받은 선물은 쿠팡에서 바로 볼 수 있다
    - 연인, 가족, 친구, 직장 동료 선물 가이드가 있다

# 글 주제. season 이 있으면 그 기간(월-일, 양 끝 포함)에만 쓴다. 없으면 언제나 쓴다.
# 시즌 주제와 상시 주제를 섞어 가장 오래 안 쓴 것부터 고른다 (generator.pick_subject).
occasions:
  - theme: 수능 끝난 수험생 선물
    season: ["11-13", "12-10"]
  - theme: 크리스마스 선물
    season: ["11-25", "12-24"]
  - theme: 연말 감사 선물 (직장 동료, 친구)
    season: ["12-10", "12-31"]
  - theme: 설 명절 부모님 선물
    season: ["01-10", "02-20"]
  - theme: 밸런타인데이 선물
    season: ["01-25", "02-14"]
  - theme: 화이트데이 선물
    season: ["02-20", "03-14"]
  - theme: 졸업·입학 선물
    season: ["01-20", "03-05"]
  - theme: 어버이날 선물
    season: ["04-20", "05-08"]
  - theme: 스승의날 선물
    season: ["05-01", "05-15"]
  - theme: 친구 생일 선물
  - theme: 연인 기념일 선물 (100일, 1주년)
  - theme: 부모님 생신 선물
  - theme: 집들이 선물
  - theme: 취업 축하 선물
